<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Dynamic, elegant theme background -->
  <rect width="100%" height="100%" fill="#FDFBF7"/>
  <!-- Outline to give it a polaroid/frame feel -->
  <rect x="20" y="20" width="360" height="460" fill="none" stroke="#CBA135" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Content -->
  <text x="50%" y="48%" font-family="'Playfair Display', serif" font-size="34" fill="#243B35" text-anchor="middle" font-style="italic">Photo</text>
  <text x="50%" y="56%" font-family="'Inter', sans-serif" font-size="14" fill="#A86573" text-anchor="middle" letter-spacing="4">COMING SOON</text>
  
  <!-- Subtle minimalist camera icon at the bottom -->
  <g transform="translate(180, 360)" fill="none" stroke="#E25C2B" stroke-width="2" opacity="0.6">
    <rect x="5" y="10" width="30" height="20" rx="3"/>
    <circle cx="20" cy="20" r="6"/>
    <path d="M 12 10 L 15 5 L 25 5 L 28 10"/>
  </g>
</svg>
